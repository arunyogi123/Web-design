<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <label for ="fullname">Enter your full name:</label><br />
        <input id="fullname" type="text"/>
        <hr />
        <label for="ward">Enter your ward numebr:</label><br />
        <input id="ward" type="number" min="1" max="100" step="7"/><br />
        <hr />
        <label for ="email">Enter your email address:</label><br />
        <input id="email" type="email"/>
        <hr />
        <label for="password">Enter your password:</label><br />
        <input id="password" type="password" /><br />
        <hr />
        <label for ="favcolor">Enter your favourite color:</label><br />
        <input id="favcolor" type="color"/>
        <hr />
        <label for="CV">Please uplaod your cv:</label><br />
        <input id="CV" type="file" /><br />
        <hr />
        <label for ="msg">Enter your message:</label><br />
        <textarea id="msg" rows="10"></textarea>
        <hr />

        <label for="subj">Select your favourite subject:</label><br />
        <select name="favsubject" id="subj" multiple>
            <option value="Javascript">js</option>
            <option value="Python">py</option>
            <option value="c++">C++</option>
        </select>
        <hr />

    </form>
</body>
</html>
