<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Course Inquiry</h1>
    <p>Please submit your details via the form below.Our support team will get back to you as soon as possible </p>
<form>
    <label for="course">Course *</label><br />
    <select name ="your course" id="course">
        <option value="Python and Django">Python and Django</option>
        <option value="Web design">Web Desing</option>
        <option value="Graphic design">Graphic Desing</option>
        <option value="Javascript">Javascript</option>
        <textarea id="course" columns="10"></textarea>
    </select>
    <br />
    <br />
    <label for="name">Name*</label><br />
    <input type="text" type="text"/><br />
    <br />
    <label for="email">Email*</label><br />
    <input type="email" type="email"/><br />
    <br />
    <label for="no">Number*</label><br />
    <input type="number" type="number"/><br />
    <br />
    <label for="msg">Message*</label><br />
    <textarea id="msg" rows="10"></textarea><br />

    <label for="Choices">Have an alternate number</label><br />
    

</form>

    
</body>
</html>
