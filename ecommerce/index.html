<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Products</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Intro Section -->
    <section id="intro">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <h1>All Products</h1>
                    <i class="fa-solid fa-circle"></i>
                </div>
            </div>
        </div>
    </section>


    <!-- Products Section -->
    <section id="products" class="py-5">

        <div class="container-fluid">

            <div class="row">

                <!-- Sidebar -->
                <div class="col-md-3">

                    <!-- Search -->
                    <div class="bg-storekit p-4 rounded-4">

                        <b class="border-bottom pb-3 mb-3 d-block">
                            Search
                        </b>

                        <form>
                            <input type="text"
                                class="form-control border-0 p-3"
                                placeholder="Search Product">
                        </form>

                    </div>


                    <!-- Colors -->
                    <div class="bg-storekit p-4 mt-4 rounded-4">

                        <b class="border-bottom pb-3 mb-3 d-block">
                            Colors
                        </b>


                        <!-- Black -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="black"
                                    name="color"
                                    value="black">

                                <label for="black" class="ms-1">
                                    Black
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Red -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="red"
                                    name="color"
                                    value="red">

                                <label for="red" class="ms-1">
                                    Red
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Green -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="green"
                                    name="color"
                                    value="green">

                                <label for="green" class="ms-1">
                                    Green
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Yellow -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="yellow"
                                    name="color"
                                    value="yellow">

                                <label for="yellow" class="ms-1">
                                    Yellow
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Pink -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="pink"
                                    name="color"
                                    value="pink">

                                <label for="pink" class="ms-1">
                                    Pink
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Purple -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="purple"
                                    name="color"
                                    value="purple">

                                <label for="purple" class="ms-1">
                                    Purple
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Brown -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="brown"
                                    name="color"
                                    value="brown">

                                <label for="brown" class="ms-1">

                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>

                    </div>


                    <!-- Sizes -->
                    <div class="bg-storekit p-4 mt-4 rounded-4">

                        <b class="border-bottom pb-3 mb-3 d-block">
                            Sizes
                        </b>


                        <!-- Small -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="small"
                                    name="size"
                                    value="small">

                                <label for="small" class="ms-1">
                                    Small
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Medium -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="medium"
                                    name="size"
                                    value="medium">

                                <label for="medium" class="ms-1">
                                    Medium
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Large -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="large"
                                    name="size"
                                    value="large">

                                <label for="large" class="ms-1">
                                    Large
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>


                        <!-- Extra Large -->
                        <div class="d-flex justify-content-between py-2">

                            <div>
                                <input type="radio"
                                    id="extra_large"
                                    name="size"
                                    value="extra_large">

                                <label for="extra_large" class="ms-1">
                                    Extra Large
                                </label>
                            </div>

                            <div>
                                (02)
                            </div>

                        </div>

                    </div>

                </div>


                <!-- Products Area -->
                <div class="col-md-9">

                    <!-- Sorting -->
                    <div class="bg-storekit p-4 d-flex justify-content-between align-items-center">

                        <div>
                            Showing 1–16 of 17 results
                        </div>

                        <div>
                            <select name="sorting"
                                id="sorting"
                                class="form-control">

                                <option value="default">
                                    Default Sorting
                                </option>

                                <option value="latest">
                                    Latest Product
                                </option>

                                <option value="old">
                                    Old Product
                                </option>

                            </select>
                        </div>

                    </div>


                    <!-- Product Cards -->
                    <div class="row mt-4">


                        <!-- Product 1 -->
                        <div class="col-lg-4 col-md-6 mb-4">

                            <div class="bg-storekit p-4 rounded-4">

                                <div class="d-flex justify-content-between">

                                    <div class="bg-warning py-1 px-2 fs-6">
                                        New
                                    </div>

                                    <a href="#" aria-label="Add to wishlist">
                                        <i class="fa-regular fa-heart"></i>
                                    </a>

                                </div>


                                <img class="mx-auto d-block img-fluid"
                                    src="https://storekit-bootstrap-html-template.netlify.app/assets/images/product/l3-1.png"
                                    alt="Product">


                                <div class="d-flex mt-3">

                                    <a href="#"
                                        class="btn btn-outline-dark w-50 me-2">
                                        QUICK VIEW
                                    </a>

                                    <a href="#"
                                        class="btn btn-outline-dark w-50 ms-2">
                                        ADD TO CART
                                    </a>

                                </div>

                            </div>

                        </div>


                        <!-- Product 2 -->
                        <div class="col-lg-4 col-md-6 mb-4">

                            <div class="bg-storekit p-4 rounded-4">

                                <div class="d-flex justify-content-between">

                                    <div class="bg-warning py-1 px-2 fs-6">
                                        New
                                    </div>

                                    <a href="#" aria-label="Add to wishlist">
                                        <i class="fa-regular fa-heart"></i>
                                    </a>

                                </div>


                                <img class="mx-auto d-block img-fluid"
                                    src="https://storekit-bootstrap-html-template.netlify.app/assets/images/product/l3-1.png"
                                    alt="Product">

                                    <a href="#"

                                    </a>

                                    <a href="#"
                                        class="btn btn-outline-dark w-50 ms-2">

                                </div>

                        </div>


                        <!-- Product 3 -->
                        <div class="col-lg-4 col-md-6 mb-4">

                            <div class="bg-storekit p-4 rounded-4">

                                <div class="d-flex justify-content-between">

                                    <div class="bg-warning py-1 px-2 fs-6">
                                        New
                                    </div>

                                    <a href="#" aria-label="Add to wishlist">
                                        <i class="fa-regular fa-heart"></i>
                                    </a>

                                </div>


                                <img class="mx-auto d-block img-fluid"
                                    src="https://storekit-bootstrap-html-template.netlify.app/assets/images/product/l3-1.png"
                                    alt="Product">


                                <div class="d-flex mt-3">

                                    <a href="#"
                                        class="btn btn-outline-dark w-50 me-2">
                                        QUICK VIEW
                                    </a>

                                    <a href="#"
                                        class="btn btn-outline-dark w-50 ms-2">
                                        ADD TO CART
                                    </a>

                                </div>

                            </div>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
